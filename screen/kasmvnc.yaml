desktop:
  resolution:
    width: 1280
    height: 800
network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6901
  use_ipv4: true
  use_ipv6: false
  ssl:
    require_ssl: false
  udp:
    public_ip: 127.0.0.1
    port: 0
command_line:
  prompt: false
security:
  brute_force_protection:
    blacklist_threshold: 10000
    blacklist_timeout: 1
data_loss_prevention:
  clipboard:
    delay_between_operations: none
    allow_mimetypes:
      - chromium/x-web-custom-data
      - text/html
      - image/png
      - text/plain
    server_to_client:
      enabled: true
      size: unlimited
    client_to_server:
      enabled: true
      size: unlimited
