desktop:
  resolution:
    width: 1280
    height: 800
network:
  protocol: http
  interface: 0.0.0.0
  websocket_port: 6901
  use_ipv4: true
  use_ipv6: false
  ssl:
    require_ssl: false
  udp:
    public_ip: 127.0.0.1
    port: 0
command_line:
  prompt: false
security:
  brute_force_protection:
    blacklist_threshold: 10000
    blacklist_timeout: 1
