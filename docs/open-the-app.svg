<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <title>OpenBot empty chat after Password</title>
  <rect width="1280" height="800" fill="#1c1916"/>
  <rect width="256" height="800" fill="#171411"/>
  <line x1="256" y1="0" x2="256" y2="800" stroke="#2a2622"/>
  <text x="24" y="36" fill="#e8b86d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="3.2">OPENBOT</text>
  <text x="24" y="58" fill="#a89f91" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">This Computer</text>
  <line x1="0" y1="76" x2="256" y2="76" stroke="#2a2622"/>
