# Screen only. Talk is the host start script (ADR 0005). Ctrl-C leaves Screen up.
services:
  screen:
    build: ./screen
    ports:
      - "127.0.0.1:6901:6901"
    environment:
      VNC_USER: openbot
      VNC_PASSWORD: ${OPENBOT_PASSWORD:-openbot}
    shm_size: "1gb"
    restart: unless-stopped
