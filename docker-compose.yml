# One Computer. Extra Bots are extra Kasm displays inside this container.
# Host ports come from start.ts (never 6901; the agent desktop often owns it).
# Ctrl-C of Talk leaves this container up.
services:
  screen:
    # Google Chrome is amd64-only. Mac ARM runs this image via qemu/Rosetta.
    platform: linux/amd64
    build: ./screen
    image: openbot-screen
    container_name: openbot-screen
    ports:
      - "127.0.0.1:${SCREEN_PORT_1:-16901}:6901"
      - "127.0.0.1:${SCREEN_PORT_2:-16902}:6902"
      - "127.0.0.1:${SCREEN_PORT_3:-16903}:6903"
      - "127.0.0.1:${SCREEN_PORT_4:-16904}:6904"
      - "127.0.0.1:${SCREEN_PORT_5:-16905}:6905"
      - "127.0.0.1:${SCREEN_PORT_6:-16906}:6906"
      - "127.0.0.1:${SCREEN_PORT_7:-16907}:6907"
      - "127.0.0.1:${SCREEN_PORT_8:-16908}:6908"
      - "127.0.0.1:${PINCHTAB_PORT_1:-19867}:9867"
      - "127.0.0.1:${PINCHTAB_PORT_2:-19868}:9868"
      - "127.0.0.1:${PINCHTAB_PORT_3:-19869}:9869"
      - "127.0.0.1:${PINCHTAB_PORT_4:-19870}:9870"
      - "127.0.0.1:${PINCHTAB_PORT_5:-19871}:9871"
      - "127.0.0.1:${PINCHTAB_PORT_6:-19872}:9872"
      - "127.0.0.1:${PINCHTAB_PORT_7:-19873}:9873"
      - "127.0.0.1:${PINCHTAB_PORT_8:-19874}:9874"
    environment:
      VNC_USER: openbot
      VNC_PASSWORD: ${OPENBOT_PASSWORD:-openbot}
      PINCHTAB_TOKEN: ${PINCHTAB_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "openbot-cookies.test:host-gateway"
    volumes:
      - ${OPENBOT_WORKSPACE:-${OPENBOT_HOME:-${HOME}/.openbot}/workspace}:/workspace
      - ${OPENBOT_COOKIES:-./computer/cookies}:/computer/cookies
    shm_size: "1gb"
    restart: unless-stopped
