# Screen image only. Talk docker-runs one container per Active Bot
# (unique loopback port, unique home volume, shared cookie jar + workspace).
# Do not publish 6901 here; the agent desktop often already owns it.
services:
  screen:
    build: ./screen
    image: openbot-screen
    shm_size: "1gb"
    environment:
      VNC_USER: openbot
      VNC_PASSWORD: ${OPENBOT_PASSWORD:-openbot}
